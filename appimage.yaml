# File di configurazione AppImage per OpenDSA: Reading
app: OpenDSA-Reading

# Informazioni sull'applicazione
ingredients:
  dist: bionic
  sources:
    - deb http://archive.ubuntu.com/ubuntu/ bionic main universe
  packages:
    - libasound2
    - libpulse0
    - libsndfile1

# Configurazione dell'AppImage
script:
  # Crea la directory AppDir
  - mkdir -p $BUILD_APPDIR/usr/bin
  - mkdir -p $BUILD_APPDIR/usr/share/applications
  - mkdir -p $BUILD_APPDIR/usr/share/icons/hicolor/256x256/apps
  - mkdir -p $BUILD_APPDIR/usr/share/thesis_project/vosk
  - mkdir -p $BUILD_APPDIR/usr/bin/data/flutter_assets/vosk

  # Copia i file dell'applicazione
  - cp -r build/linux/x64/release/bundle/* $BUILD_APPDIR/usr/bin/
  
  # Copia i file del modello VOSK in più posizioni
  - cp -r vosk/* $BUILD_APPDIR/usr/share/thesis_project/vosk/
  - cp -r vosk/* $BUILD_APPDIR/usr/bin/data/flutter_assets/vosk/

  # Crea symlinks per ridondanza
  - ln -sf $BUILD_APPDIR/usr/share/thesis_project/vosk $BUILD_APPDIR/vosk
  
  # Copia l'icona
  - cp assets/icon/app_icon.png $BUILD_APPDIR/usr/share/icons/hicolor/256x256/apps/OpenDSA-Reading.png
  - cp assets/icon/app_icon.png $BUILD_APPDIR/OpenDSA-Reading.png

  # Crea il file .desktop
  - cat > $BUILD_APPDIR/usr/share/applications/OpenDSA-Reading.desktop <<EOF
  [Desktop Entry]
  Type=Application
  Name=OpenDSA: Reading
  Comment=Applicazione per assistere persone con dislessia nella lettura
  Exec=thesis_project
  Icon=OpenDSA-Reading
  Categories=Education;Accessibility;
  EOF
  
  # Copia il file .desktop nella root dell'AppDir
  - cp $BUILD_APPDIR/usr/share/applications/OpenDSA-Reading.desktop $BUILD_APPDIR/
  
  # Crea lo script AppRun con debug
  - cat > $BUILD_APPDIR/AppRun <<EOF
  #!/bin/bash
  HERE="\$(dirname "\$(readlink -f "\${0}")")"
  export PATH="\${HERE}/usr/bin:\${PATH}"
  export LD_LIBRARY_PATH="\${HERE}/usr/lib:\${HERE}/usr/lib/x86_64-linux-gnu:\${LD_LIBRARY_PATH}"
  
  # Debugging - stampa la struttura delle directory
  echo "AppImage directories:"
  find "\$HERE" -type d -name "vosk" -o -path "*/flutter_assets*" | sort
  
  # Assicuriamoci che i modelli VOSK siano accessibili
  if [[ ! -d "\$HERE/usr/bin/data/flutter_assets/vosk" ]]; then
  echo "ATTENZIONE: Directory VOSK non trovata in flutter_assets, creazione..."
  mkdir -p "\$HERE/usr/bin/data/flutter_assets/vosk"
  if [[ -d "\$HERE/usr/share/thesis_project/vosk" ]]; then
  cp -r "\$HERE/usr/share/thesis_project/vosk/"* "\$HERE/usr/bin/data/flutter_assets/vosk/"
  echo "Copiati i file VOSK da usr/share/thesis_project/vosk"
  elif [[ -d "\$HERE/vosk" ]]; then
  cp -r "\$HERE/vosk/"* "\$HERE/usr/bin/data/flutter_assets/vosk/"
  echo "Copiati i file VOSK da \$HERE/vosk"
  fi
  fi
  
  # Esegui l'applicazione
  "\${HERE}/usr/bin/thesis_project" "\$@"
  EOF
  
  # Rendi AppRun eseguibile
  - chmod +x $BUILD_APPDIR/AppRun

# Configurazione di build finale
build:
  appdir: $BUILD_APPDIR
  arch: x86_64
  update_info: true